<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - جامعة الغردقة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/admin.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <img src="assets/hurghada-logo.png" alt="شعار جامعة الغردقة">
            </div>

            <h3>لوحة إدارة جامعة الغردقة</h3>
            <p class="login-subtitle">تسجيل دخول المسؤول</p>

            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="emailInput" class="form-control" dir="ltr" placeholder="admin@hurghada.edu.eg">
            </div>

            <div class="mb-4">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="passwordInput" class="form-control" dir="ltr" placeholder="********">
            </div>

            <button class="btn btn-primary w-100" id="loginBtn">دخول المسؤول</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Js/admin/data.js"></script>
    <script src="Js/admin/ui.js"></script>
    <script src="Js/admin/auth.js"></script>
</body>
</html>
