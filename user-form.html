<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - جامعة الغردقة</title>
    <script>
        if (!localStorage.getItem("adminToken")) {
            window.location.href = "admin-login.html";
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/admin.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom px-3 px-lg-4">
        <div class="container-fluid d-flex align-items-center w-100">
            <a href="admin.html" class="navbar-brand-wrap d-flex align-items-center gap-2 text-decoration-none">
                <img src="assets/hurghada-logo.png" alt="شعار جامعة الغردقة" class="navbar-logo">
                <span class="navbar-brand-text">جامعة الغردقة</span>
            </a>

            <ul class="navbar-nav d-flex flex-row ms-auto align-items-center gap-1 gap-lg-2 mb-0">
                <li class="nav-item"><a class="nav-link active" href="admin.html">إدارة المستخدمين</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-departments.html">إدارة الأقسام</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-colleges.html">إدارة الكليات</a></li>
                <li class="nav-item"><a class="nav-link logout-link" href="#" onclick="adminLogout()">تسجيل الخروج</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container mt-4 form-page-container">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold mb-4" id="pageTitle">إضافة مستخدم</h4>

                <div class="mb-3">
                    <label class="form-label">الاسم الكامل</label>
                    <input id="fullNameInput" class="form-control" placeholder="أدخل الاسم الكامل">
                </div>

                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input id="emailInput" type="email" class="form-control" dir="ltr" placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input id="passwordInput" type="password" class="form-control" dir="ltr" placeholder="********">
                    <small class="text-muted">اتركها فارغة في حالة التعديل</small>
                </div>

                <div class="mb-3" id="roleField">
                    <label class="form-label">رقم المستوى</label>
                    <input id="roleInput" type="number" class="form-control" placeholder="مثال: 1">
                </div>

                <div class="mb-4">
                    <label class="form-label">رقم الإدارة</label>
                    <select id="departmentInput" class="form-select">
                        <option value="">اختر الإدارة</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="submitForm()">حفظ</button>
                    <a href="admin.html" class="btn btn-outline-secondary">رجوع</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Js/admin/data.js"></script>
    <script src="Js/admin/ui.js"></script>
    <script src="Js/admin/user-form.js"></script>
</body>

</html>
