<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الكليات - جامعة الغردقة</title>
    <script>
        if (!localStorage.getItem("adminToken")) {
            window.location.href = "admin-login.html";
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/admin.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom px-3 px-lg-4">
        <div class="container-fluid d-flex align-items-center w-100">
            <a href="admin.html" class="navbar-brand-wrap d-flex align-items-center gap-2 text-decoration-none">
                <img src="assets/hurghada-logo.png" alt="شعار جامعة الغردقة" class="navbar-logo">
                <span class="navbar-brand-text">جامعة الغردقة</span>
            </a>

            <ul class="navbar-nav d-flex flex-row ms-auto align-items-center gap-1 gap-lg-2 mb-0">
                <li class="nav-item"><a class="nav-link" href="admin.html">إدارة المستخدمين</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-departments.html">إدارة الأقسام</a></li>
                <li class="nav-item"><a class="nav-link active" href="admin-colleges.html">إدارة الكليات</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-departments-report.html">تقرير الأقسام</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-yearly-report.html">التقرير السنوي</a></li>
                <li class="nav-item"><a class="nav-link logout-link" href="#" onclick="adminLogout()">تسجيل الخروج</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container mt-4">
        <h4 class="fw-bold mb-3">إدارة الكليات</h4>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">إضافة كلية جديدة</h5>
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="collegeNameInput" class="form-control" placeholder="اسم الكلية">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" onclick="addCollege()">إضافة</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>رقم الكلية</th>
                        <th>اسم الكلية</th>
                        <th width="170">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="collegesTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Js/admin/data.js"></script>
    <script src="Js/admin/ui.js"></script>
    <script src="Js/admin/colleges.js"></script>
